class="m" font-size="17" fill="#efe6d8" >run smoother. That's what pulled me in.</text><text x="50" y="455" class="mb" font-size="13" fill="#d8b98a" letter-spacing="2">HOW I BUILD</text><text x="50" y="487" class="m" font-size="17" fill="#efe6d8" >AI is part of how I develop. What I'm learning</text><text x="50" y="514" class="m" font-size="17" fill="#efe6d8" >is how to make it trustworthy: small tasks,</text><text x="50" y="541" class="m" font-size="17" fill="#efe6d8" >tests first, a real review on every change.</text><text x="50" y="568" class="m" font-size="17" fill="#efe6d8" >Most projects start as "I wish this existed".</text><rect x="660" y="300" width="490" height="262" rx="12" fill="#1e1a16" stroke="#3a322a"/><text x="684" y="340" class="mb" font-size="12" fill="#a39684" letter-spacing="1">STUDYING</text><text x="800" y="340" class="m" font-size="15" fill="#efe6d8" >CS · AUPP + FHSU dual degree</text><text x="684" y="378" class="mb" font-size="12" fill="#a39684" letter-spacing="1">BOOTCAMP</text><text x="800" y="378" class="m" font-size="15" fill="#efe6d8" >DICHI Techpreneur, full-stack</text><text x="684" y="416" class="mb" font-size="12" fill="#a39684" letter-spacing="1">INTERNED</text><text x="800" y="416" class="m" font-size="15" fill="#efe6d8" >~1 year, government sector</text><text x="684" y="454" class="mb" font-size="12" fill="#a39684" letter-spacing="1">SPEAKS</text><text x="800" y="454" class="m" font-size="15" fill="#efe6d8" >Khmer, English, learning Chinese</text><text x="684" y="492" class="mb" font-size="12" fill="#a39684" letter-spacing="1">OFF HOURS</text><text x="800" y="492" class="m" font-size="15" fill="#efe6d8" >gym, training on TikTok</text><text x="684" y="530" class="mb" font-size="12" fill="#a39684" letter-spacing="1">STACK</text><text x="800" y="530" class="m" font-size="15" fill="#efe6d8" >Python · TS · Rust · Go · Swift</text></svg>