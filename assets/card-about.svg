<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">About Bunhour: CS student in Phnom Penh (AUPP + FHSU dual degree, DICHI Techpreneur full-stack track, about a year interning in the government sector). Path: HTML as a kid, cybersecurity in grade 9, full-stack web and mobile now, AI engineering next. AI is part of how I develop; I&#x27;m learning to make it trustworthy with small tasks, tests first and real review. Speaks Khmer and English, learning Chinese. Off hours: gym.</title><style>@font-face{font-family:'M';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'MB';src:url(data:font/woff2;base64,) format('woff2')}.m{font-family:M,ui-monospace,monospace}.mb{font-family:MB,ui-monospace,monospace;font-weight:800}.u{font-family:U,sans-serif;font-weight:800}.uw{font-family:UW,sans-serif}.k{font-family:K,sans-serif}.km{font-family:KM,serif}
